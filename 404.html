<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Taylored Harmony</title>
<script>
  var l = window.location;
  var path = l.pathname.slice(1);
  l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?p=' + encodeURIComponent(path) + (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') + l.hash);
</script>
</head>
<body></body>
</html>
