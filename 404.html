<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Taylored Harmony</title>
<script>
  var seg = window.location.pathname.split('/').slice(1);
  var query = seg.join('/');
  if (query) {
    window.location.replace('/?/' + query + window.location.search + window.location.hash);
  } else {
    window.location.replace('/');
  }
</script>
</head>
<body></body>
</html>
