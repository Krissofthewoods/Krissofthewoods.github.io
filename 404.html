<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <script>
    // GitHub Pages SPA redirect: store path in sessionStorage, redirect to root
    var path = window.location.pathname + window.location.search;
    sessionStorage.setItem('spa-redirect', path);
    window.location.replace('/');
  </script>
</head>
<body></body>
</html>
