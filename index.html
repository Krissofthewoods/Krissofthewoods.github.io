<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taylored Harmony</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #0a0a0a;
      color: #f0ece4;
      font-family: 'Georgia', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .container {
      max-width: 520px;
      padding: 2rem;
    }
    .wordmark {
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 2.5rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 400;
      line-height: 1.4;
      margin-bottom: 1.5rem;
      color: #f0ece4;
    }
    p {
      font-size: 1rem;
      line-height: 1.8;
      color: #a09880;
    }
    .divider {
      width: 40px;
      height: 1px;
      background: #c9a84c;
      margin: 2rem auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="wordmark">Taylored Harmony</div>
    <h1>Something new is coming.</h1>
    <div class="divider"></div>
    <p>This space is being rebuilt. Check back soon.</p>
  </div>
</body>
</html>
